[package]
name = "local-proxy"
version = "0.9.0"
edition = "2021"
description = "Local multi-provider translation proxy (OpenAI <-> Anthropic) in Rust"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
futures-util = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
directories = "5"
miette = { version = "7", features = ["fancy"] }
sha2 = "0.10"
rpassword = "7"
dialoguer = "0.11"
notify = "7"
notify-debouncer-full = "0.4"
rmcp = { version = "3.1", features = ["schemars", "transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
http = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
