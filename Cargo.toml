[package]
name = "local-proxy"
version = "0.23.0"
edition = "2021"
description = "Local multi-provider translation proxy (OpenAI <-> Anthropic) in Rust"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
futures-util = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
directories = "5"
miette = { version = "7", features = ["fancy"] }
sha2 = "0.10"
rpassword = "7"
# OAuth 2.0 (PKCE subscription logins): base64url encoding for the PKCE
# challenge, and URL building for the authorize endpoint. Both crates are
# already in the dependency tree (reqwest); they are only direct deps now.
base64 = "0.22"
url = "2"
notify = "7"
notify-debouncer-full = "0.4"
# SQLCipher with a vendored, statically linked OpenSSL, so release binaries
# need no system OpenSSL (Perl is required at build time; see README).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
getrandom = "0.2"
# Sandboxed script template for the status line: isolated by default (no
# file/network/host access unless explicitly registered), so a user template
# can do arithmetic/comparisons but is never arbitrary code.
rhai = { version = "1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
http = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
