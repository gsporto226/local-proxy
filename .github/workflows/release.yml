name: Release

on:
  push:
    tags: ["v*"]
    # Caches are scoped per ref: a tag run can only restore caches saved by
    # itself or by the default branch. Building on main keeps a warm release
    # cache that every tag restores, so a tag recompiles only local-proxy.
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: local-proxy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: local-proxy.exe
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable

      # Prefix restore instead of rust-cache: every release bump rewrites
      # Cargo.lock, so an exact key never matches. The prefix match only finds
      # caches saved on main (see the `branches` trigger above): a tag run
      # cannot read another tag's cache. Cargo is safe with a stale target dir -
      # it recompiles only what changed, not vendored OpenSSL/SQLCipher.
      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            v0-release-${{ runner.os }}-

      - name: secret service build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: build release
        run: cargo build --release --locked

      - name: stage artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cd dist
          sha256sum "${{ matrix.bin }}" > "${{ matrix.bin }}.sha256"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: local-proxy-${{ matrix.target }}
          path: dist/*

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
