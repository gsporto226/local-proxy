name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: local-proxy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: local-proxy.exe
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2

      - name: build release
        run: cargo build --release --locked

      - name: stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" dist/
          cd dist
          sha256sum "${{ matrix.bin }}" > "${{ matrix.bin }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: local-proxy-${{ matrix.target }}
          path: dist/*

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
