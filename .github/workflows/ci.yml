name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: fmt (estrito)
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: "clippy (estrito: -D warnings + pedantic + nursery)"
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: unit tests
        run: cargo test --all-features

      - name: bun toolchain
        uses: oven-sh/setup-bun@v2

      - name: e2e mock (Bun)
        working-directory: e2e
        run: |
          cargo build --manifest-path ../Cargo.toml
          bun install
          bun test mock.test.ts

  audit:
    name: cargo-audit (segurança)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
