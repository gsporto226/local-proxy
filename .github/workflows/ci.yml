name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: fmt (estrito)
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: secret service build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: "clippy (estrito: -D warnings + pedantic + nursery)"
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: secret service for tests (Linux vault)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config gnome-keyring
          # Create and unlock the login keyring with a throwaway password; the
          # tests only need a working, unlocked Secret Service.
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'

      - name: unit tests
        run: cargo test --all-features

      - name: bun toolchain
        uses: oven-sh/setup-bun@v2

      - name: e2e mock (Bun)
        working-directory: e2e
        run: |
          cargo build --manifest-path ../Cargo.toml
          bun install
          bun test mock.test.ts

  claude-mod:
    name: claude-mod (validate + test)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: validate
        run: |
          claude plugin validate .
          claude plugin validate claude-mod
      - name: test
        run: claude plugin test claude-mod

  audit:
    name: cargo-audit (segurança)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
