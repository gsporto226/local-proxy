# local-proxy example configuration.
#
# The provider catalog is embedded in the binary (src/catalog.yaml). This file
# only *adds* or *overrides* providers/routes/defaults from that catalog.
# For the full list of embedded providers (anthropic, openai, opencode-go, zen,
# groq, xai, google, deepseek, openrouter) and their models, edit the catalog or
# run `local-proxy providers`.

server:
  host: 127.0.0.1
  port: 8787
  api_keys:
    - sk-proxy
  passthrough_keys: false

# Example: override an existing provider (same name replaces the catalog entry).
# providers:
#   - name: openai
#     base_url: https://api.openai.com/v1
#     api_key_env: OPENAI_API_KEY
#     format: openai
#     models:
#       - gpt-4o
#
# Example: add a custom provider.
# providers:
#   - name: mylocal
#     base_url: http://127.0.0.1:8080/v1
#     api_key_env: MYLOCAL_API_KEY
#     format: openai
#     models:
#       - local-model
#
# routes:
#   - model: mylocal-model
#     provider: mylocal
#
# defaults:
#   provider: anthropic
