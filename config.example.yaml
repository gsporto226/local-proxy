# local-proxy example configuration.
#
# The provider catalog is embedded in the binary (src/catalog.yaml). This file
# only *adds* or *overrides* providers/routes/defaults from that catalog.
# For the full list of embedded providers (anthropic, openai, chatgpt,
# opencode-go, zen, groq, xai, google, deepseek, openrouter, neuralwatt) and
# their models, edit the catalog or run `local-proxy providers`.
#
# Provider credentials live exclusively in the global encrypted account store
# (`accounts.db`, key in the OS credential vault), never in the config. Store
# a key with:
#   local-proxy connect <provider> --account <alias> [key]
#
# Subscription providers (ChatGPT Plus/Pro) log in with OAuth instead:
#   local-proxy connect chatgpt --account <alias> --oauth

server:
  host: 127.0.0.1
  port: 8787
  api_keys:
    - sk-proxy
  passthrough_keys: false

# Example: override an existing provider (same name replaces the catalog entry).
# providers:
#   - name: openai
#     base_url: https://api.openai.com/v1
#     format: openai
#     models:
#       - gpt-4o
#     # `auto` (bare or as `openai/auto`) sends this model upstream.
#     auto_model: gpt-4o
#
# Example: add a custom provider.
# providers:
#   - name: mylocal
#     base_url: http://127.0.0.1:8080/v1
#     format: openai
#     models:
#       - local-model
#
# Example: a Responses-API provider with a static key.
# providers:
#   - name: my-responses-host
#     base_url: https://example.com/v1
#     format: openai-responses
#     models:
#       - some-model
#
# Example: pin a reasoning effort to a ChatGPT model. Effort is a request field,
# not part of the model id, so each variant is a route over the same slug.
# routes:
#   - model: chatgpt/gpt-6-sol-low
#     provider: chatgpt
#     upstream_model: gpt-6-sol
#     reasoning_effort: low       # none | minimal | low | medium | high | xhigh | max
#
# routes:
#   - model: mylocal-model
#     provider: mylocal
#
# defaults:
#   provider: anthropic
#   # Active model is selected as `provider/model` via `local-proxy model`
#   # (e.g. `opencode-go/deepseek-v4-flash`); persisted here.
#   active_model: opencode-go/deepseek-v4-flash

