# local-proxy example configuration.
#
# The provider catalog is embedded in the binary (src/catalog.yaml). This file
# only *adds* or *overrides* providers/routes/defaults from that catalog.
# For the full list of embedded providers (anthropic, openai, opencode-go, zen,
# groq, xai, google, deepseek, openrouter, neuralwatt) and their models, edit
# the catalog or run `local-proxy providers`.
#
# Provider API keys live exclusively in the global auth store (`auth.json`),
# never in the config. Store a key with:
#   local-proxy connect <provider> [key]

server:
  host: 127.0.0.1
  port: 8787
  api_keys:
    - sk-proxy
  passthrough_keys: false

# Example: override an existing provider (same name replaces the catalog entry).
# providers:
#   - name: openai
#     base_url: https://api.openai.com/v1
#     format: openai
#     models:
#       - gpt-4o
#
# Example: add a custom provider.
# providers:
#   - name: mylocal
#     base_url: http://127.0.0.1:8080/v1
#     format: openai
#     models:
#       - local-model
#
# routes:
#   - model: mylocal-model
#     provider: mylocal
#
# defaults:
#   provider: anthropic
#   # Active model is selected as `provider/model` via `local-proxy model`
#   # (e.g. `opencode-go/deepseek-v4-flash`); persisted here.
#   active_model: opencode-go/deepseek-v4-flash

# Status line template for the Claude Code status line (see README). A Rhai
# script evaluated against the current session's recorded stats. A `--template`
# flag on `local-proxy statusline` overrides this block. Available params:
# session (cost_session, cost_month, cost_total, cost_known), tokens_in,
# tokens_out, requests, model, context_pct. Absent values bind to `?`.
# statusline:
#   template: "{model} · {cost_session} · {context_pct}% ctx"
