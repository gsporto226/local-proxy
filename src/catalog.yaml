# Catálogo de providers embutido no binário (base).
# O config.yaml do usuário só adiciona ou sobrescreve o que está aqui.
# Suportamos dois wire formats: anthropic (Messages API) e openai (Chat Completions).

providers:
  - name: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    format: anthropic
    models:
      - claude-sonnet-4-5
      - claude-opus-4-1
  - name: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    format: openai
    models:
      - gpt-4o
      - gpt-5.1
  - name: opencode-go
    base_url: https://opencode.ai/zen/go
    api_key_env: OPENCODE_ZEN_KEY
    format: openai
    models:
      - opencode-go/deepseek-v4-flash
      - opencode-go/deepseek-v4-pro
      - opencode-go/kimi-k2.6
      - opencode-go/glm-5.1
      - opencode-go/gpt-5.6-luna
      - opencode-go/grok-4.5
      - opencode-go/kimi-k2.7-code
      - opencode-go/kimi-k3
      - opencode-go/mimo-v2.5-pro
      - opencode-go/minimax-m3
      - opencode-go/qwen3.7-max
  - name: zen
    base_url: https://opencode.ai/zen
    api_key_env: OPENCODE_ZEN_KEY
    format: openai
    models:
      - deepseek-v4-flash-free
      - claude-sonnet-4-5
      - gpt-5.1
  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    format: openai
    models:
      - llama-3.3-70b-versatile
  - name: xai
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    format: openai
    models:
      - grok-4
  - name: google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GOOGLE_API_KEY
    format: openai
    models:
      - gemini-2.5-pro
      - gemini-2.5-flash
  - name: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    format: openai
    models:
      - deepseek-chat
      - deepseek-reasoner
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    format: openai
    headers:
      HTTP-Referer: https://github.com/gsporto226/local-proxy
      X-Title: local-proxy
    models:
      - openrouter/auto

routes:
  - model: claude-sonnet
    provider: anthropic
    prefix: true
    upstream_model: claude-sonnet-4-5
  - model: claude-opus
    provider: anthropic
    prefix: true
    upstream_model: claude-opus-4-1
  - model: gpt-4o
    provider: openai
  - model: deepseek-free
    provider: zen
    upstream_model: deepseek-v4-flash-free
  - model: deepseek-v4-flash
    provider: opencode-go
  - model: deepseek-v4-pro
    provider: opencode-go
