# CatÃ¡logo de providers embutido no binÃ¡rio (base).
# O config.yaml do usuÃ¡rio sÃ³ adiciona ou sobrescreve o que estÃ¡ aqui.
# Suportamos dois wire formats: anthropic (Messages API) e openai (Chat Completions).
# Os modelos não ficam aqui: são buscados em GET /v1/models de cada provider conectado.

providers:
  - name: anthropic
    base_url: https://api.anthropic.com
    format: anthropic
  - name: openai
    base_url: https://api.openai.com/v1
    format: openai
  - name: opencode-go
    base_url: https://opencode.ai/zen/go
    format: openai
    session_header: x-opencode-session
  - name: zen
    base_url: https://opencode.ai/zen
    format: openai
    session_header: x-opencode-session
  - name: groq
    base_url: https://api.groq.com/openai/v1
    format: openai
  - name: xai
    base_url: https://api.x.ai/v1
    format: openai
  - name: google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    format: openai
  - name: deepseek
    base_url: https://api.deepseek.com
    format: openai
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    format: openai
    headers:
      HTTP-Referer: https://github.com/gsporto226/local-proxy
      X-Title: local-proxy
  - name: neuralwatt
    base_url: https://api.neuralwatt.com/v1
    format: openai

